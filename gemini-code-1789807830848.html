<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mis Tareas</title>

    <link rel="apple-touch-icon" href="icono.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Agenda">

    <style>
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-color: #000000;
            --accent-color: #007AFF;
            --danger-color: #FF3B30;
            --list-border: #C6C6C8;
            --time-color: #8E8E93;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #1C1C1E;
                --text-color: #FFFFFF;
                --list-border: #38383A;
                --time-color: #98989D;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Bloqueamos el tamaño exacto a la pantalla visible del móvil */
        html, body {
            height: 100%;
            height: 100dvh; /* Altura dinámica exacta para iOS */
            overflow: hidden; /* Evita que la pantalla entera haga scroll */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-top: env(safe-area-inset-top);
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 24px 20px 12px 20px;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
            flex-shrink: 0; /* Evita que el título se encoja */
        }

        /* Solo esta sección podrá hacer scroll */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px;
        }

        .task-list {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 0.5px solid var(--list-border);
            transition: opacity 0.2s;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-checkbox {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid var(--list-border);
            border-radius: 50%;
            margin-right: 16px;
            outline: none;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }

        .task-checkbox:checked {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .task-checkbox:checked::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            width: 10px;
            height: 5px;
            border: 2px solid white;
            border-top: none;
            border-right: none;
            transform: rotate(-45deg);
        }

        .task-content {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: space-between;
            margin-right: 12px;
            min-width: 0;
        }

        .task-text {
            font-size: 17px;
            transition: color 0.2s, text-decoration 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-time {
            font-size: 15px;
            color: var(--time-color);
            white-space: nowrap;
            margin-left: 8px;
        }

        .task-item.completed .task-text,
        .task-item.completed .task-time {
            color: var(--time-color);
            text-decoration: line-through;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            font-size: 15px;
            cursor: pointer;
            padding: 8px 0 8px 8px;
        }

        /* La barra de controles se mantiene fija al fondo de la pantalla visible */
        .controls-wrapper {
            flex-shrink: 0; /* Evita que la barra se deforme */
            display: flex;
            padding: 12px 20px calc(16px + env(safe-area-inset-bottom));
            background-color: var(--bg-color);
            border-top: 0.5px solid var(--list-border);
            align-items: center;
        }

        .task-input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid var(--list-border);
            font-size: 17px;
            background-color: var(--card-bg);
            color: var(--text-color);
            outline: none;
        }

        .task-input::placeholder {
            color: gray;
        }

        .add-btn {
            margin-left: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .add-btn:active {
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <header>Mis Tareas</header>

    <main>
        <div class="task-list" id="taskList"></div>
    </main>

    <div class="controls-wrapper">
        <input type="text" id="taskInput" class="task-input" placeholder="Toca y usa el 🎤 del teclado" autocomplete="off">
        <button class="add-btn" id="addBtn">Añadir</button>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        
        let tasks = JSON.parse(localStorage.getItem('apple_tasks')) || [];

        function saveTasks() {
            localStorage.setItem('apple_tasks', JSON.stringify(tasks));
        }

        function renderTasks() {
            taskList.innerHTML = '';
            
            if (tasks.length === 0) {
                taskList.style.display = 'none';
                return;
            } else {
                taskList.style.display = 'block';
            }

            tasks.forEach((task, index) => {
                const div = document.createElement('div');
                div.className = `task-item ${task.completed ? 'completed' : ''}`;
                
                const timeHtml = task.time ? `<span class="task-time">${task.time}</span>` : '';

                div.innerHTML = `
                    <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
                    <div class="task-content">
                        <span class="task-text">${task.text}</span>
                        ${timeHtml}
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${index})">Borrar</button>
                `;
                taskList.appendChild(div);
            });
        }

        window.toggleTask = function(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        }

        window.deleteTask = function(index) {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        }

        function processDictation(text) {
            let rawTasks = text.split(/ y luego | y después | y despues | luego | después | despues | además | también | y |, |\.\s/gi);
            
            rawTasks.forEach(t => {
                let cleanTask = t.trim();
                
                if (cleanTask.toLowerCase().startsWith('a ')) cleanTask = cleanTask.substring(2).trim();
                
                if(cleanTask.length > 2) {
                    
                    const timeRegex = /(?:\s+durante\s+|\s+)?((?:media|una|un|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|\d+)\s*(?:hora|horas|minuto|minutos)(?:\s+y\s+(?:media|meia|cuarto))?)$/i;
                    const match = cleanTask.match(timeRegex);
                    
                    let taskName = cleanTask;
                    let taskTime = null;

                    if (match) {
                        taskName = cleanTask.replace(match[0], '').trim();
                        taskTime = match[1].trim();
                        if (taskTime.includes("meia")) {
                            taskTime = taskTime.replace("meia", "media");
                        }
                    }

                    taskName = taskName.charAt(0).toUpperCase() + taskName.slice(1);
                    
                    tasks.push({ text: taskName, time: taskTime, completed: false });
                }
            });
            
            saveTasks();
            renderTasks();
            
            // Hacer scroll hacia abajo automáticamente al añadir tareas para ver las últimas
            const mainEl = document.querySelector('main');
            mainEl.scrollTop = mainEl.scrollHeight;
        }

        addBtn.addEventListener('click', () => {
            const val = taskInput.value.trim();
            if(val) {
                processDictation(val);
                taskInput.value = ''; 
            }
        });

        taskInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addBtn.click();
            }
        });

        renderTasks();
    </script>
</body>
</html>
