<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Configuración iOS App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F2F2F7">
    
    <title>StudyApp</title>
    
    <style>
        :root {
            --bg-color: #F2F2F7;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-solid: #FFFFFF;
            --text-main: #1C1C1E;
            --text-muted: #8E8E93;
            --apple-blue: #007AFF;
            --apple-blue-hover: #0056b3;
            --apple-green: #34C759;
            --apple-red: #FF3B30;
            --border-radius-lg: 24px;
            --border-radius-md: 14px;
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.05);
            --shadow-btn: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: var(--bg-color);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        @media (min-width: 481px) {
            .app-container {
                min-height: 850px;
                height: 90vh;
                border-radius: 40px;
                border: 8px solid #ffffff;
            }
        }

        .view {
            display: none;
            flex: 1;
            padding: 30px 24px;
            flex-direction: column;
            animation: fadeScale 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            box-sizing: border-box;
            position: relative;
        }
        .view.active { display: flex; }

        @keyframes fadeScale {
            0% { opacity: 0; transform: scale(0.97) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.8px;
            margin: 10px 0 20px 0;
            color: var(--text-main);
        }
        
        .header-title {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: -0.2px;
        }

        /* Botones estilo iOS */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .menu-btn {
            background: var(--card-solid);
            border: none;
            padding: 20px;
            border-radius: var(--border-radius-lg);
            display: flex;
            align-items: center;
            cursor: pointer;
            box-shadow: var(--shadow-subtle);
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-align: left;
        }

        .menu-btn:active {
            transform: scale(0.96);
            background: #E5E5EA;
        }

        .icon-box {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-right: 16px;
            background: #F2F2F7;
        }

        .menu-btn.blue .icon-box { background: rgba(0, 122, 255, 0.1); color: var(--apple-blue); }
        .menu-btn.green .icon-box { background: rgba(52, 199, 89, 0.1); color: var(--apple-green); }
        .menu-btn.orange .icon-box { background: rgba(255, 149, 0, 0.1); color: #FF9500; }
        .menu-btn.purple .icon-box { background: rgba(175, 82, 222, 0.1); color: #AF52DE; }

        .menu-text-content h3 { margin: 0 0 4px 0; font-size: 1.15rem; font-weight: 600; color: var(--text-main); }
        .menu-text-content p { margin: 0; font-size: 0.9rem; color: var(--text-muted); }

        .back-nav { display: flex; align-items: center; margin-bottom: 10px; }
        .back-btn {
            background: none;
            border: none;
            color: var(--apple-blue);
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            padding: 10px 0;
            display: flex;
            align-items: center;
            margin-left: -8px;
        }
        .back-btn:active { opacity: 0.6; }
        .back-btn svg { width: 22px; height: 22px; margin-right: 2px; }

        .action-btn {
            background: var(--apple-blue);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: var(--border-radius-md);
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, opacity 0.1s;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
            margin-bottom: 10px;
        }
        .action-btn:active { transform: scale(0.97); opacity: 0.9; }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-radius: var(--border-radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 24px;
        }

        /* Fisiología */
        .progress-container { margin-bottom: 20px; }
        .progress-bar {
            width: 100%; background-color: #E5E5EA; border-radius: 8px; height: 8px; overflow: hidden; margin-bottom: 8px;
        }
        .progress-fill {
            height: 100%; background-color: var(--apple-green); width: 0%; transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); border-radius: 8px;
        }
        .stats { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }

        .word-title {
            font-size: 1.8rem; color: var(--text-main); margin: 5px 0 15px 0; font-weight: 700; text-align: center; letter-spacing: -0.5px;
        }

        textarea {
            width: 100%; height: 120px; padding: 16px; border: none; border-radius: var(--border-radius-md);
            font-size: 1.05rem; font-family: inherit; resize: none; box-sizing: border-box; margin-bottom: 20px;
            background: rgba(0,0,0,0.04); color: var(--text-main); transition: background 0.2s;
        }
        textarea:focus { outline: none; background: rgba(0,0,0,0.08); }

        .feedback-area { display: none; margin-top: 10px; animation: fadeScale 0.3s; }
        .eval-buttons { display: flex; gap: 12px; margin-top: 20px;}
        .btn-correct, .btn-incorrect {
            border: none; padding: 16px; border-radius: var(--border-radius-md); cursor: pointer; flex: 1; font-weight: 600; color: white; font-size: 1rem; transition: transform 0.1s;
        }
        .btn-correct { background-color: var(--apple-green); }
        .btn-incorrect { background-color: var(--apple-red); }
        .btn-correct:active, .btn-incorrect:active { transform: scale(0.96); }

        /* Matemáticas y Numpad Personalizado */
        .math-problem {
            font-size: 4rem;
            font-weight: 700;
            text-align: center;
            margin: 20px 0;
            color: var(--text-main);
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
        }
        .math-input {
            width: 100%;
            font-size: 2.8rem;
            font-weight: 600;
            text-align: center;
            padding: 12px;
            border: none;
            border-radius: var(--border-radius-lg);
            box-sizing: border-box;
            margin-bottom: 20px;
            color: var(--apple-blue);
            background: rgba(0, 122, 255, 0.08);
            transition: transform 0.1s;
        }
        
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }

        .numpad-btn {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 16px;
            font-size: 1.6rem;
            font-weight: 500;
            color: var(--text-main);
            padding: 16px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .numpad-btn:active {
            background: #E5E5EA;
            transform: scale(0.92);
        }

        .numpad-btn.del {
            color: var(--apple-red);
        }

        .numpad-btn.enter {
            background: rgba(0, 122, 255, 0.1);
            color: var(--apple-blue);
        }
        .numpad-btn.enter:active {
            background: rgba(0, 122, 255, 0.2);
        }
        
        .math-feedback {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            height: 24px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        
        .streak-pill {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 149, 0, 0.15);
            color: #FF9500;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
            margin: 0 auto;
        }

        /* Watermark minimalista */
        .watermark {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            opacity: 0.6;
        }

        @media (max-width: 480px) {
            .app-container { min-height: 100vh; border-radius: 0; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- VISTA PRINCIPAL -->
        <div id="view-main" class="view active">
            <div style="flex: 1;">
                <h1 class="header-title">Estudio</h1>
                <p class="subtitle">Selecciona qué quieres practicar hoy</p>
                
                <div class="menu-list">
                    <button class="menu-btn blue" onclick="nav('view-agilidad')">
                        <div class="icon-box">🧠</div>
                        <div class="menu-text-content">
                            <h3>Agilidad Mental</h3>
                            <p>Cálculo rápido y tablas</p>
                        </div>
                    </button>
                    
                    <button class="menu-btn green" onclick="nav('view-fisiologia')">
                        <div class="icon-box">🧬</div>
                        <div class="menu-text-content">
                            <h3>Fisiología Animal</h3>
                            <p>Términos y conceptos</p>
                        </div>
                    </button>
                </div>
            </div>
            
            <div class="watermark">by Marcos Muñoz</div>
        </div>

        <!-- VISTA MENÚ AGILIDAD MENTAL -->
        <div id="view-agilidad" class="view">
            <div class="back-nav">
                <button class="back-btn" onclick="nav('view-main')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                    Atrás
                </button>
            </div>
            
            <h1 class="header-title">Agilidad Mental</h1>
            
            <div class="menu-list" style="margin-top: 10px;">
                <button class="menu-btn blue" onclick="startMath('multi')">
                    <div class="icon-box">✖️</div>
                    <div class="menu-text-content">
                        <h3>Tablas de Multiplicar</h3>
                        <p>Practica del 0 al 10</p>
                    </div>
                </button>
                <button class="menu-btn orange" onclick="startMath('addsub')">
                    <div class="icon-box">➕</div>
                    <div class="menu-text-content">
                        <h3>Sumas y Restas</h3>
                        <p>Operaciones rápidas</p>
                    </div>
                </button>
                <button class="menu-btn purple" onclick="startMath('degrees')">
                    <div class="icon-box">📐</div>
                    <div class="menu-text-content">
                        <h3>Cálculo de Grados</h3>
                        <p>Suma y resta de ángulos</p>
                    </div>
                </button>
            </div>
        </div>

        <!-- VISTA JUEGO MATEMÁTICAS -->
        <div id="view-math" class="view">
            <div class="back-nav">
                <button class="back-btn" onclick="nav('view-agilidad')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                    Modos
                </button>
            </div>
            
            <div style="text-align: center; margin-top: 0px;">
                <div class="streak-pill" id="math-score">Racha: 0 🔥</div>
            </div>
            
            <div class="math-problem" id="math-problem">5 x 5</div>
            <!-- readonly evita que salga el teclado nativo -->
            <input type="text" class="math-input" id="math-input" placeholder="" readonly />
            
            <button class="action-btn" onclick="checkMath()">Comprobar</button>
            <div class="math-feedback" id="math-feedback"></div>

            <!-- Teclado Numérico Custom -->
            <div class="numpad">
                <button class="numpad-btn" onclick="typeNum('1')">1</button>
                <button class="numpad-btn" onclick="typeNum('2')">2</button>
                <button class="numpad-btn" onclick="typeNum('3')">3</button>
                
                <button class="numpad-btn" onclick="typeNum('4')">4</button>
                <button class="numpad-btn" onclick="typeNum('5')">5</button>
                <button class="numpad-btn" onclick="typeNum('6')">6</button>
                
                <button class="numpad-btn" onclick="typeNum('7')">7</button>
                <button class="numpad-btn" onclick="typeNum('8')">8</button>
                <button class="numpad-btn" onclick="typeNum('9')">9</button>
                
                <button class="numpad-btn del" onclick="typeDel()">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
                </button>
                <button class="numpad-btn" onclick="typeNum('0')">0</button>
                <button class="numpad-btn enter" onclick="checkMath()">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 10 4 15 9 20"></polyline><path d="M20 4v7a4 4 0 0 1-4 4H4"></path></svg>
                </button>
            </div>
        </div>

        <!-- VISTA FISIOLOGÍA ANIMAL -->
        <div id="view-fisiologia" class="view">
            <div class="back-nav">
                <button class="back-btn" onclick="nav('view-main')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                    Atrás
                </button>
            </div>
            
            <div id="fisio-main" style="display: flex; flex-direction: column; flex: 1;">
                <div class="progress-container">
                    <div class="stats">
                        <span id="counter">Restantes: 20</span>
                        <span id="score">Aprendidas: 0</span>
                    </div>
                    <div class="progress-bar" style="margin-top: 8px;">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>

                <div class="glass-panel" style="margin-top: 10px;">
                    <div style="font-size: 0.85rem; font-weight: 600; color: var(--apple-blue); text-transform: uppercase; letter-spacing: 1px; text-align: center;">Concepto</div>
                    <div class="word-title" id="current-word">Cargando...</div>
                    <textarea id="user-input" placeholder="Tu definición..."></textarea>
                    <button class="action-btn" id="check-btn" onclick="revisarRespuesta()">Revisar Respuesta</button>
                </div>

                <div class="glass-panel feedback-area" id="feedback-area">
                    <h3 id="system-feedback" style="margin-top: 0; font-size: 1.2rem;"></h3>
                    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600;">Definición correcta:</p>
                    <p id="correct-definition" style="font-size: 1.05rem; line-height: 1.5; margin-top: 0;"></p>
                    
                    <div class="eval-buttons">
                        <button class="btn-incorrect" onclick="marcarResultado(false)">Repasar</button>
                        <button class="btn-correct" onclick="marcarResultado(true)">Lo sabía</button>
                    </div>
                </div>
            </div>

            <div id="fisio-completed" style="display: none; flex: 1; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
                <div style="font-size: 5rem; margin-bottom: 20px;">🎉</div>
                <h2 style="font-size: 2rem; margin-top: 0; margin-bottom: 10px;">¡Completado!</h2>
                <p style="color: var(--text-muted); margin-bottom: 40px; font-size: 1.1rem;">Has dominado todos los conceptos.</p>
                <button class="action-btn" onclick="reiniciarEstudio()" style="background: var(--apple-green);">Reiniciar mazo</button>
            </div>
        </div>
    </div>

    <script>
        // --- NAVEGACIÓN ---
        function nav(viewId) {
            document.querySelectorAll('.view').forEach(v => {
                v.classList.remove('active');
            });
            document.getElementById(viewId).classList.add('active');
            
            if(viewId === 'view-fisiologia' && mazo.length === 0) {
                inicializarFisio();
            }
        }

        // --- LÓGICA AGILIDAD MENTAL ---
        let mathMode = '';
        let currentAnswer = 0;
        let mathScore = 0;

        // Soporte para teclado físico (ordenador)
        document.addEventListener('keydown', function (e) {
            if (document.getElementById('view-math').classList.contains('active')) {
                if (e.key >= '0' && e.key <= '9') {
                    typeNum(e.key);
                } else if (e.key === 'Backspace') {
                    typeDel();
                } else if (e.key === 'Enter') {
                    checkMath();
                }
            }
        });

        function typeNum(numStr) {
            const input = document.getElementById('math-input');
            input.value += numStr;
        }

        function typeDel() {
            const input = document.getElementById('math-input');
            input.value = input.value.slice(0, -1);
        }

        function startMath(mode) {
            mathMode = mode;
            mathScore = 0;
            updateMathScore();
            document.getElementById('math-feedback').innerText = '';
            nav('view-math');
            generateMathProblem();
        }

        function updateMathScore() {
            document.getElementById('math-score').innerText = `Racha: ${mathScore} 🔥`;
        }

        function generateMathProblem() {
            const input = document.getElementById('math-input');
            input.value = '';
            
            let problemText = '';
            
            if (mathMode === 'multi') {
                const a = Math.floor(Math.random() * 11);
                const b = Math.floor(Math.random() * 11);
                problemText = `${a} × ${b}`;
                currentAnswer = a * b;
            } 
            else if (mathMode === 'addsub') {
                const isAdd = Math.random() > 0.5;
                if (isAdd) {
                    const a = Math.floor(Math.random() * 100) + 1;
                    const b = Math.floor(Math.random() * 100) + 1;
                    problemText = `${a} + ${b}`;
                    currentAnswer = a + b;
                } else {
                    let a = Math.floor(Math.random() * 100) + 1;
                    let b = Math.floor(Math.random() * 100) + 1;
                    if (b > a) { let temp = a; a = b; b = temp; }
                    problemText = `${a} - ${b}`;
                    currentAnswer = a - b;
                }
            } 
            else if (mathMode === 'degrees') {
                const angles = [10, 15, 20, 30, 45, 60, 90, 120, 180, 270, 360];
                const a = angles[Math.floor(Math.random() * angles.length)] + (Math.floor(Math.random() * 3) * 90);
                const b = angles[Math.floor(Math.random() * angles.length)];
                
                const isAdd = Math.random() > 0.5;
                if (isAdd) {
                    problemText = `${a}° + ${b}°`;
                    currentAnswer = a + b;
                } else {
                    let valA = a, valB = b;
                    if (valB > valA) { let temp = valA; valA = valB; valB = temp; }
                    problemText = `${valA}° - ${valB}°`;
                    currentAnswer = valA - valB;
                }
            }
            document.getElementById('math-problem').innerText = problemText;
        }

        function checkMath() {
            const inputVal = document.getElementById('math-input').value;
            if (inputVal === '') return;

            const userAns = parseInt(inputVal, 10);
            const feedback = document.getElementById('math-feedback');
            const input = document.getElementById('math-input');

            if (userAns === currentAnswer) {
                feedback.innerText = '¡Perfecto!';
                feedback.style.color = 'var(--apple-green)';
                mathScore++;
                updateMathScore();
                
                setTimeout(() => {
                    feedback.innerText = '';
                    generateMathProblem();
                }, 350);
            } else {
                feedback.innerText = `Incorrecto. Era ${currentAnswer}`;
                feedback.style.color = 'var(--apple-red)';
                mathScore = 0; 
                updateMathScore();
                
                setTimeout(() => {
                    input.value = '';
                    feedback.innerText = '';
                    generateMathProblem();
                }, 1500);
            }
        }

        // --- LÓGICA FISIOLOGÍA ---
        const baseDiccionario = [
            { term: "Hiperplasia", def: "Multiplicación o división celular que incrementa el número total de células en un tejido.", kw: ["multiplicación", "división", "número"] },
            { term: "Hipertrofia", def: "Incremento en el tamaño o volumen individual de las células preexistentes.", kw: ["tamaño", "volumen", "preexistentes"] },
            { term: "Morfogénesis", def: "Formación, ensamblaje y modelado funcional de los órganos y sistemas integrados del cuerpo.", kw: ["formación", "modelado", "órganos", "sistemas"] },
            { term: "Alometría", def: "Fenómeno por el cual distintas partes corporales, órganos y tejidos no crecen al mismo ritmo (crecimiento relativo).", kw: ["ritmo", "sincrónica", "relativo", "distintas"] },
            { term: "Somatotropina (GH)", def: "Hormona secretada por la adenohipófisis con patrón pulsátil; estimula el crecimiento longitudinal óseo y la síntesis de proteínas musculares.", kw: ["hormona", "adenohipófisis", "hueso", "músculo", "crecimiento"] },
            { term: "Somatocrinina (GHRH)", def: "Hormona liberadora hipotalámica que estimula directamente la síntesis y liberación de la Hormona de Crecimiento (GH).", kw: ["estimula", "liberadora", "hipotálamo"] },
            { term: "Somatostatina (SS/GHIH)", def: "Péptido neuroendocrino hipotalámico que inhibe de forma potente la liberación de GH.", kw: ["inhibe", "péptido", "hipotalámico"] },
            { term: "Grelina", def: "Hormona peptídica secretada por la mucosa gástrica que estimula el apetito y la secreción de somatotropina.", kw: ["gástrica", "apetito", "estómago"] },
            { term: "IGF-1", def: "Factor de crecimiento insulínico tipo 1. Sintetizado en el hígado, media la aceleración de la osificación estimulada por la GH.", kw: ["hígado", "osificación", "factor", "insulínico"] },
            { term: "Vasopresina (ADH)", def: "Hormona antidiurética liberada por la neurohipófisis, responsable de la retención de agua y mantenimiento de la volemia.", kw: ["antidiurética", "agua", "renal", "volemia"] },
            { term: "Colecistoquinina (CCK)", def: "Hormona intestinal liberada por la distensión estomacal que estimula la secreción biliar/pancreática y actúa como señal de saciedad.", kw: ["saciedad", "biliar", "distensión"] },
            { term: "Leptina", def: "Hormona liberada por los adipocitos que actúa en el hipotálamo como señal de plenitud energética inhibiendo la ingesta.", kw: ["adipocitos", "grasa", "plenitud", "inhibiendo"] },
            { term: "Blastocisto", def: "Estadio embrionario inicial compuesto por la masa celular interna (dará origen al embrión) y el trofoblasto.", kw: ["embrionario", "masa", "celular"] },
            { term: "Trofoblasto", def: "Capa externa del blastocisto que dará origen a los anexos embrionarios.", kw: ["placenta", "corion", "alantoides", "externa"] },
            { term: "Onda Basípeta", def: "Segunda onda morfogenética de crecimiento que progresa en sentido disto-proximal, desde las extremidades hacia el tronco.", kw: ["extremidades", "tronco", "disto", "proximal"] },
            { term: "Crecimiento Compensatorio", def: "Capacidad de un animal de recuperar el retraso ponderal sufrido tras una restricción nutritiva.", kw: ["recuperar", "restricción", "ganancia", "superiores"] },
            { term: "Curvas de Hammond", def: "Modelo que describe el orden cronológico de desarrollo de los tejidos: 1º Nervioso, 2º Óseo, 3º Muscular, 4º Adiposo.", kw: ["jerarquía", "orden", "nervioso", "óseo", "muscular", "adiposo"] },
            { term: "Precocidad", def: "Capacidad de un animal para completar rápidamente su desarrollo fisiológico, depositando grasa a edades tempranas.", kw: ["rápidamente", "tempranas", "grasa", "adulto"] },
            { term: "Grasa Intramuscular", def: "Última grasa en depositarse, localizada dentro de los fascículos musculares. Determina la calidad de la carne.", kw: ["última", "fascículos", "calidad", "jugosidad"] },
            { term: "Índice de Conversión (IC)", def: "Parámetro que mide la eficiencia nutritiva; indica la cantidad de alimento necesaria para ganar 1 kg de peso.", kw: ["eficiencia", "alimento", "peso"] }
        ];

        let mazo = [];
        let indexActual = 0;
        let aprendidasCount = 0;

        function inicializarFisio() {
            const guardado = localStorage.getItem('fisioZootecniaMazoV4');
            if (guardado) {
                mazo = JSON.parse(guardado);
            } else {
                mazo = baseDiccionario.map(item => ({ ...item, aprendida: false }));
                mazo.sort(() => Math.random() - 0.5);
                guardarProgreso();
            }

            if (mazo.every(item => item.aprendida)) {
                mostrarPantallaFinal();
                return;
            }

            mazo.sort((a, b) => (a.aprendida === b.aprendida)? 0 : a.aprendida? 1 : -1);
            indexActual = 0;
            actualizarUI();
        }

        function guardarProgreso() {
            localStorage.setItem('fisioZootecniaMazoV4', JSON.stringify(mazo));
        }

        function actualizarUI() {
            const noAprendidas = mazo.filter(i => !i.aprendida).length;
            aprendidasCount = mazo.filter(i => i.aprendida).length;

            if (noAprendidas === 0) {
                mostrarPantallaFinal();
                return;
            }

            document.getElementById('counter').innerText = `Restantes: ${noAprendidas}`;
            document.getElementById('score').innerText = `Aprendidas: ${aprendidasCount} / ${baseDiccionario.length}`;
            
            const porcentaje = (aprendidasCount / baseDiccionario.length) * 100;
            document.getElementById('progress-fill').style.width = `${porcentaje}%`;

            document.getElementById('current-word').innerText = mazo[indexActual].term;
            document.getElementById('user-input').value = "";
            document.getElementById('feedback-area').style.display = 'none';
            document.getElementById('check-btn').style.display = 'block';
        }

        function revisarRespuesta() {
            const input = document.getElementById('user-input').value.trim().toLowerCase();
            if (input === "") {
                const btn = document.getElementById('check-btn');
                btn.innerText = "Escribe algo primero";
                setTimeout(() => btn.innerText = "Revisar Respuesta", 1500);
                return;
            }

            const itemActual = mazo[indexActual];
            let hits = 0;
            itemActual.kw.forEach(keyword => {
                if (input.includes(keyword)) hits++;
            });

            const pFeedback = document.getElementById('system-feedback');
            if (hits >= Math.min(2, itemActual.kw.length)) {
                pFeedback.innerText = "¡Buen trabajo!";
                pFeedback.style.color = "var(--apple-green)";
            } else {
                pFeedback.innerText = "Faltan conceptos clave";
                pFeedback.style.color = "var(--apple-red)";
            }

            document.getElementById('correct-definition').innerText = itemActual.def;
            document.getElementById('check-btn').style.display = 'none';
            document.getElementById('feedback-area').style.display = 'block';
        }

        function marcarResultado(loSabia) {
            if (loSabia) {
                mazo[indexActual].aprendida = true;
            } else {
                const item = mazo.splice(indexActual, 1)[0];
                mazo.push(item);
                indexActual--; 
            }
            guardarProgreso();
            indexActual++;
            
            const noAprendidas = mazo.filter(i => !i.aprendida).length;
            if (indexActual >= noAprendidas) indexActual = 0;

            actualizarUI();
        }

        function mostrarPantallaFinal() {
            document.getElementById('fisio-main').style.display = 'none';
            document.getElementById('fisio-completed').style.display = 'flex';
        }

        function reiniciarEstudio() {
            localStorage.removeItem('fisioZootecniaMazoV4');
            document.getElementById('fisio-completed').style.display = 'none';
            document.getElementById('fisio-main').style.display = 'flex';
            inicializarFisio();
        }
    </script>
</body>
</html>
