<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repaso: Fisiología del Crecimiento y Desarrollo</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --bg-color: #f4f6f5;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            background-color: var(--card-bg);
            max-width: 600px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-top: 0;
            font-size: 1.5rem;
        }

        .progress-bar {
            width: 100%;
            background-color: var(--border-color);
            border-radius: 8px;
            height: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .card {
            background-color: #fefefe;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .word-title {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin: 10px 0;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(46, 125, 50, 0.2);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #9e9e9e;
            cursor: not-allowed;
        }

        .feedback-area {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background-color: #f0f7f0;
            border-left: 4px solid var(--primary-color);
            text-align: left;
        }

        .eval-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-correct {
            background-color: #388e3c;
        }
        .btn-incorrect {
            background-color: #d32f2f;
        }
        .btn-incorrect:hover {
            background-color: #b71c1c;
        }

        .completed-state {
            text-align: center;
            display: none;
        }

        @media (max-width: 480px) {
            .app-container {
                padding: 20px;
            }
            .word-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="app-main">
        <h1>Estudio de Fisiología Zootécnica</h1>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        
        <div class="stats">
            <span id="counter">Término: 1 / 20</span>
            <span id="score">Aprendidas: 0</span>
        </div>

        <div class="card">
            <div style="font-size: 0.9rem; color: var(--text-muted);">Define el siguiente concepto:</div>
            <div class="word-title" id="current-word">Cargando...</div>
        </div>

        <textarea id="user-input" placeholder="Escribe aquí tu definición o explicación..."></textarea>
        
        <button id="check-btn" onclick="revisarRespuesta()">Revisar Respuesta</button>

        <div class="feedback-area" id="feedback-area">
            <p id="system-feedback" style="font-weight: bold; margin-top: 0;"></p>
            <p><strong>Definición correcta:</strong></p>
            <p id="correct-definition" style="color: #2e7d32;"></p>
            <p style="font-size: 0.9rem; margin-top: 15px; color: var(--text-muted);">Sé honesto contigo mismo. ¿Tu explicación contenía la idea principal?</p>
            <div class="eval-buttons">
                <button class="btn-correct" onclick="marcarResultado(true)">Lo tenía bien</button>
                <button class="btn-incorrect" onclick="marcarResultado(false)">Necesito repasarlo</button>
            </div>
        </div>
    </div>

    <div class="app-container completed-state" id="app-completed">
        <h1>¡Repaso Completado!</h1>
        <p>Has repasado todos los términos pendientes.</p>
        <button onclick="reiniciarEstudio()" style="margin-top: 20px;">Reiniciar todo el mazo</button>
    </div>

    <script>
        const baseDiccionario = [
            { term: "Hiperplasia", def: "Multiplicación o división celular que incrementa el número total de células en un tejido. Predomina en la etapa embrionaria y fetal temprana.", kw: ["multiplicación", "división", "número"] },
            { term: "Hipertrofia", def: "Incremento en el tamaño o volumen individual de las células preexistentes por acumulación citoplasmática y proteica.", kw: ["tamaño", "volumen", "preexistentes"] },
            { term: "Morfogénesis", def: "Formación, ensamblaje y modelado funcional de los órganos y sistemas integrados del cuerpo.", kw: ["formación", "modelado", "órganos", "sistemas"] },
            { term: "Alometría", def: "Fenómeno por el cual distintas partes corporales, órganos y tejidos no crecen al mismo ritmo ni de forma sincrónica (crecimiento relativo).", kw: ["ritmo", "sincrónica", "relativo", "distintas"] },
            { term: "Somatotropina (GH)", def: "Hormona secretada por la adenohipófisis con patrón pulsátil; estimula el crecimiento longitudinal óseo y la síntesis de proteínas musculares.", kw: ["hormona", "adenohipófisis", "hueso", "músculo", "crecimiento"] },
            { term: "Somatocrinina (GHRH)", def: "Hormona liberadora hipotalámica que estimula directamente la síntesis y liberación de la Hormona de Crecimiento (GH).", kw: ["estimula", "liberadora", "hipotálamo"] },
            { term: "Somatostatina (SS/GHIH)", def: "Péptido neuroendocrino hipotalámico que inhibe de forma potente la liberación de GH.", kw: ["inhibe", "péptido", "hipotalámico"] },
            { term: "Grelina", def: "Hormona peptídica secretada por la mucosa gástrica que estimula el apetito y la secreción de somatotropina.", kw: ["gástrica", "apetito", "estómago"] },
            { term: "IGF-1 (Somatomedina C)", def: "Factor de crecimiento insulínico tipo 1. Sintetizado en el hígado, media la aceleración de la osificación estimulada por la GH.", kw: ["hígado", "osificación", "factor", "insulínico"] },
            { term: "Vasopresina (ADH)", def: "Hormona antidiurética liberada por la neurohipófisis, responsable de la retención de agua en el túbulo colector renal y mantenimiento de la volemia.", kw: ["antidiurética", "agua", "renal", "volemia"] },
            { term: "Colecistoquinina (CCK)", def: "Hormona intestinal liberada por la distensión estomacal que estimula la secreción biliar/pancreática y actúa como señal de saciedad.", kw: ["saciedad", "biliar", "distensión"] },
            { term: "Leptina", def: "Hormona liberada por los adipocitos que actúa en el hipotálamo como señal de plenitud energética inhibiendo la ingesta.", kw: ["adipocitos", "grasa", "plenitud", "inhibiendo"] },
            { term: "Blastocisto", def: "Estadio embrionario inicial compuesto por la masa celular interna (dará origen al embrión) y el trofoblasto.", kw: ["embrionario", "masa", "celular"] },
            { term: "Trofoblasto", def: "Capa externa del blastocisto que dará origen a los anexos embrionarios: placenta, alantoides y corion.", kw: ["placenta", "corion", "alantoides", "externa"] },
            { term: "Onda Basípeta", def: "Segunda onda morfogenética de crecimiento que progresa en sentido disto-proximal, desde las extremidades hacia el tronco.", kw: ["extremidades", "tronco", "disto", "proximal"] },
            { term: "Crecimiento Compensatorio", def: "Capacidad de un animal de recuperar el retraso ponderal sufrido tras una restricción nutritiva, alcanzando tasas de ganancia de peso superiores a lo normal.", kw: ["recuperar", "restricción", "ganancia", "superiores"] },
            { term: "Curvas de Hammond", def: "Modelo que describe la jerarquía y el orden cronológico de desarrollo de los tejidos: 1º Nervioso, 2º Óseo, 3º Muscular, 4º Adiposo.", kw: ["jerarquía", "orden", "nervioso", "óseo", "muscular", "adiposo"] },
            { term: "Precocidad", def: "Capacidad de un animal para completar rápidamente su desarrollo fisiológico, depositando grasa y llegando al peso adulto a edades tempranas.", kw: ["rápidamente", "tempranas", "grasa", "adulto"] },
            { term: "Grasa Intramuscular (Veteado)", def: "Última grasa en depositarse, localizada dentro de los fascículos musculares. Determina la calidad, jugosidad y palatabilidad de la carne.", kw: ["última", "fascículos", "calidad", "jugosidad"] },
            { term: "Índice de Conversión (IC)", def: "Parámetro que mide la eficiencia nutritiva; indica la cantidad de alimento necesaria para ganar 1 kg de peso vivo.", kw: ["eficiencia", "alimento", "peso"] }
        ];

        let mazo = [];
        let indexActual = 0;
        let aprendidasCount = 0;

        function inicializar() {
            // Intentar cargar progreso usando LocalStorage para guardar las sesiones
            const guardado = localStorage.getItem('fisioZootecniaMazo');
            if (guardado) {
                mazo = JSON.parse(guardado);
            } else {
                // Mezclar array original
                mazo = baseDiccionario.map(item => ({ ...item, aprendida: false }));
                mazo.sort(() => Math.random() - 0.5);
                guardarProgreso();
            }

            // Filtrar solo las no aprendidas para esta sesión
            if (mazo.every(item => item.aprendida)) {
                mostrarPantallaFinal();
                return;
            }

            // Mover las no aprendidas al principio
            mazo.sort((a, b) => (a.aprendida === b.aprendida)? 0 : a.aprendida? 1 : -1);
            indexActual = 0;
            actualizarUI();
        }

        function guardarProgreso() {
            localStorage.setItem('fisioZootecniaMazo', JSON.stringify(mazo));
        }

        function actualizarUI() {
            const noAprendidas = mazo.filter(i => !i.aprendida).length;
            aprendidasCount = mazo.filter(i => i.aprendida).length;

            if (noAprendidas === 0) {
                mostrarPantallaFinal();
                return;
            }

            document.getElementById('counter').innerText = `Pendientes: ${noAprendidas}`;
            document.getElementById('score').innerText = `Aprendidas: ${aprendidasCount} / ${baseDiccionario.length}`;
            
            const porcentaje = (aprendidasCount / baseDiccionario.length) * 100;
            document.getElementById('progress-fill').style.width = `${porcentaje}%`;

            document.getElementById('current-word').innerText = mazo[indexActual].term;
            document.getElementById('user-input').value = "";
            document.getElementById('feedback-area').style.display = 'none';
            document.getElementById('check-btn').style.display = 'block';
        }

        function revisarRespuesta() {
            const input = document.getElementById('user-input').value.trim().toLowerCase();
            if (input === "") {
                alert("Por favor, escribe algo antes de revisar.");
                return;
            }

            const itemActual = mazo[indexActual];
            let hits = 0;
            itemActual.kw.forEach(keyword => {
                if (input.includes(keyword)) hits++;
            });

            const pFeedback = document.getElementById('system-feedback');
            // Verificación inteligente y flexible
            if (hits >= Math.min(2, itemActual.kw.length)) {
                pFeedback.innerHTML = "¡Parece que captaste la idea principal! <span style='font-size:1.2rem'>🎯</span>";
                pFeedback.style.color = "#388e3c";
            } else {
                pFeedback.innerHTML = "Faltan algunas palabras o conceptos clave. <span style='font-size:1.2rem'>👀</span>";
                pFeedback.style.color = "#d32f2f";
            }

            document.getElementById('correct-definition').innerText = itemActual.def;
            
            document.getElementById('check-btn').style.display = 'none';
            document.getElementById('feedback-area').style.display = 'block';
        }

        function marcarResultado(loSabia) {
            if (loSabia) {
                mazo[indexActual].aprendida = true;
            } else {
                // Si no lo sabía, lo mandamos al final del mazo para repasarlo luego
                const item = mazo.splice(indexActual, 1)[0];
                mazo.push(item);
                indexActual--; // Ajustamos el índice porque el array se contrajo
            }
            
            guardarProgreso();
            indexActual++;
            
            // Si nos pasamos del número de no aprendidas, volvemos a empezar la ronda
            const noAprendidas = mazo.filter(i => !i.aprendida).length;
            if (indexActual >= noAprendidas) {
                indexActual = 0;
            }

            actualizarUI();
        }

        function mostrarPantallaFinal() {
            document.getElementById('app-main').style.display = 'none';
            document.getElementById('app-completed').style.display = 'block';
        }

        function reiniciarEstudio() {
            localStorage.removeItem('fisioZootecniaMazo');
            document.getElementById('app-completed').style.display = 'none';
            document.getElementById('app-main').style.display = 'block';
            inicializar();
        }

        // Iniciar
        inicializar();
    </script>
</body>
</html>
