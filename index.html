<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda iOS Local - UPNA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#F2F2F7] text-black min-h-screen pb-24">
    
    <header class="pt-12 pb-2 sticky top-0 z-10 bg-[#F2F2F7]/90 backdrop-blur-md border-b border-gray-200">
        <div class="px-6 mb-4">
            <h1 class="text-3xl font-bold tracking-tight">Agenda</h1>
            <p class="text-gray-600 mt-1" id="statusText">0 tareas pendientes.</p>
        </div>
        
        <div class="flex overflow-x-auto hide-scrollbar px-6 gap-2 pb-2" id="dayTabs">
            <!-- Se rellena automáticamente -->
        </div>
    </header>

    <main class="px-6 pt-6 space-y-8">
        <section>
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3">Horario UPNA</h2>
            <div class="space-y-3" id="horarioList">
                <!-- Se rellena automáticamente -->
            </div>
        </section>

        <section>
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3">Tareas Pendientes</h2>
            <div class="bg-white rounded-3xl shadow-sm overflow-hidden divide-y divide-gray-100" id="taskList">
                <!-- Se rellena automáticamente -->
            </div>
        </section>
    </main>

    <div class="fixed bottom-8 left-0 right-0 flex justify-center pointer-events-none">
        <button onclick="openModal()" class="pointer-events-auto bg-blue-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-3xl pb-1 hover:bg-blue-700 active:scale-95 transition-transform">
            +
        </button>
    </div>

    <!-- Modal de inserción de tareas -->
    <div id="addModal" class="fixed inset-0 bg-black/20 backdrop-blur-sm z-50 flex flex-col justify-end opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-t-3xl p-6 transform translate-y-full transition-transform duration-300" id="addSheet">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Añadir Tarea</h3>
                <button onclick="closeModal()" class="text-gray-400 font-bold p-2 text-xl">✕</button>
            </div>
            
            <div id="subjectGrid" class="grid grid-cols-2 md:grid-cols-3 gap-2 mb-4">
                <button onclick="selectSubject('Expresión Gráfica', this)" class="subj-btn p-3 text-sm font-semibold rounded-xl bg-gray-100 text-gray-600 border-2 border-transparent transition-all">Expresión Gráfica</button>
                <button onclick="selectSubject('Edafología', this)" class="subj-btn p-3 text-sm font-semibold rounded-xl bg-gray-100 text-gray-600 border-2 border-transparent transition-all">Edafología</button>
                <button onclick="selectSubject('Topografía', this)" class="subj-btn p-3 text-sm font-semibold rounded-xl bg-gray-100 text-gray-600 border-2 border-transparent transition-all">Topografía</button>
                <button onclick="selectSubject('Organografía', this)" class="subj-btn p-3 text-sm font-semibold rounded-xl bg-gray-100 text-gray-600 border-2 border-transparent transition-all">Organografía</button>
                <button onclick="selectSubject('Materiales', this)" class="subj-btn p-3 text-sm font-semibold rounded-xl bg-gray-100 text-gray-600 border-2 border-transparent transition-all">Materiales</button>
                <button onclick="selectSubject('Matemáticas I', this)" class="subj-btn p-3 text-sm font-semibold rounded-xl bg-gray-100 text-gray-600 border-2 border-transparent transition-all">Matemáticas I</button>
                <button onclick="selectSubject('Fisiología Animal', this)" class="subj-btn p-3 text-sm font-semibold rounded-xl bg-gray-100 text-gray-600 border-2 border-transparent transition-all">Fisiología Animal</button>
                <button onclick="selectSubject('Informática', this)" class="subj-btn p-3 text-sm font-semibold rounded-xl border-2 border-blue-500 bg-blue-50 text-blue-700 transition-all">Informática</button>
                <button onclick="selectSubject('General', this)" class="subj-btn p-3 text-sm font-semibold rounded-xl bg-gray-100 text-gray-600 border-2 border-transparent transition-all">General</button>
            </div>
            
            <input type="text" id="taskInput" placeholder="Nombre de la tarea..." class="w-full p-4 bg-gray-100 rounded-xl mb-6 text-base focus:outline-none">
            
            <button onclick="saveTask()" class="w-full bg-blue-600 text-white font-bold p-4 rounded-xl shadow-md active:scale-95 transition-transform">Guardar en <span id="btnDayLabel"></span></button>
        </div>
    </div>

    <script>
        const diasSemana = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
        let diaActual = "Miércoles"; // Hoy
        let selectedSubject = "Informática"; // Asignatura seleccionada por defecto

        const horarioSemanal = {
            "Lunes": [
                { subject: "Prácticas Expresión Gráfica", start: "08:00", end: "10:00" },
                { subject: "Prácticas Edafología", start: "10:00", end: "12:00" },
                { subject: "Prácticas Técnicas Topográficas", start: "12:00", end: "14:00" },
                { subject: "Organografía", start: "15:00", end: "17:00" }
            ],
            "Martes": [
                { subject: "Prácticas Organografía", start: "12:00", end: "14:00" },
                { subject: "Prácticas Resistencia de Materiales", start: "15:00", end: "17:00" }
            ],
            "Miércoles": [
                { subject: "Matemáticas I", start: "12:00", end: "14:00" },
                { subject: "Fisiología Animal", start: "15:00", end: "17:00" },
                { subject: "Edafología", start: "17:00", end: "19:00" }
            ],
            "Jueves": [
                { subject: "Prácticas Fisiología Animal", start: "12:00", end: "14:00" },
                { subject: "Técnicas Topográficas", start: "15:00", end: "17:00" }
            ],
            "Viernes": [
                { subject: "Resistencia de Materiales", start: "15:00", end: "17:00" }
            ]
        };

        let tareasPorDia = {
            "Lunes": [], "Martes": [], "Miércoles": [], "Jueves": [], "Viernes": []
        };

        function renderDayTabs() {
            const container = document.getElementById('dayTabs');
            container.innerHTML = diasSemana.map(dia => `
                <button onclick="cambiarDia('${dia}')" class="px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition-colors ${dia === diaActual ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'}">
                    ${dia}
                </button>
            `).join('');
            document.getElementById('btnDayLabel').innerText = diaActual;
        }

        function cambiarDia(dia) {
            diaActual = dia;
            renderDayTabs();
            renderHorario();
            renderTareas();
        }

        function renderHorario() {
            const container = document.getElementById('horarioList');
            const clasesHoy = horarioSemanal[diaActual] || [];
            
            if (clasesHoy.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-400 italic py-2">No hay clases registradas.</p>';
                return;
            }

            container.innerHTML = clasesHoy.map(clase => `
                <div class="p-4 bg-gray-200 rounded-2xl opacity-60 flex justify-between items-center">
                    <div>
                        <p class="text-xs font-medium text-gray-500">${clase.start} - ${clase.end}</p>
                        <p class="font-semibold text-gray-700">${clase.subject}</p>
                    </div>
                    <span class="text-xs font-bold text-gray-400">CLASE</span>
                </div>
            `).join('');
        }

        function renderTareas() {
            const container = document.getElementById('taskList');
            const tareasHoy = tareasPorDia[diaActual];
            
            if (tareasHoy.length === 0) {
                document.getElementById('statusText').innerText = `Sin tareas pendientes para el ${diaActual.toLowerCase()}.`;
                container.innerHTML = '';
            } else {
                document.getElementById('statusText').innerText = `${tareasHoy.length} tareas pendientes para el ${diaActual.toLowerCase()}.`;
                container.innerHTML = tareasHoy.map((t, index) => `
                    <div class="p-4 flex items-center gap-4 transition-all" id="tarea-${index}">
                        <button onclick="completarTarea(${index})" class="w-6 h-6 rounded-full border-2 border-gray-300 hover:border-blue-500 hover:bg-blue-50 transition-colors flex-shrink-0"></button>
                        <div>
                            <p class="text-xs font-semibold text-blue-600 uppercase">${t.subject}</p>
                            <p class="text-base font-medium text-gray-900">${t.title}</p>
                        </div>
                    </div>
                `).join('');
            }
        }

        function selectSubject(subject, btnElement) {
            selectedSubject = subject;
            document.querySelectorAll('.subj-btn').forEach(btn => {
                btn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
                btn.classList.add('border-transparent', 'bg-gray-100', 'text-gray-600');
            });
            btnElement.classList.remove('border-transparent', 'bg-gray-100', 'text-gray-600');
            btnElement.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
        }

        function openModal() {
            document.getElementById('addModal').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('addSheet').classList.remove('translate-y-full');
            document.getElementById('taskInput').value = "";
        }

        function closeModal() {
            document.getElementById('addSheet').classList.add('translate-y-full');
            setTimeout(() => {
                document.getElementById('addModal').classList.add('opacity-0', 'pointer-events-none');
            }, 300);
        }

        function saveTask() {
            const title = document.getElementById('taskInput').value;
            
            if (title.trim() !== "") {
                tareasPorDia[diaActual].push({ subject: selectedSubject, title: title });
                renderTareas();
                closeModal();
            }
        }

        function completarTarea(index) {
            const element = document.getElementById(`tarea-${index}`);
            element.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                tareasPorDia[diaActual].splice(index, 1);
                renderTareas();
            }, 300);
        }

        // Arranque inicial
        renderDayTabs();
        renderHorario();
        renderTareas();
    </script>
</body>
</html>
