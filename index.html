<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Viewport optimized for iPhone X and later (notch area, no pinch-to-zoom) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mis Tareas</title>

    <!-- iOS PWA Meta Tags -->
    <!-- Replace href with your actual 180x180 icon path -->
    <link rel="apple-touch-icon" href="https://placehold.co/180x180/007aff/ffffff?text=Tareas">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tareas">

    <!-- Tailwind CSS for utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* iOS Color Variables for Light and Dark Mode */
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-color: #000000;
            --text-secondary: #8E8E93;
            --accent-color: #007AFF;
            --danger-color: #FF3B30;
            --list-border: #C6C6C8;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #1C1C1E;
                --text-color: #FFFFFF;
                --text-secondary: #98989D;
                --list-border: #38383A;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
            /* Respect iPhone safe areas */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 24px 20px 8px 20px;
        }

        h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            padding-bottom: 120px; /* Space for the bottom mic button */
        }

        /* iOS Style List Card */
        .task-list {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 0.5px solid var(--list-border);
            transition: all 0.3s ease;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item.removing {
            opacity: 0;
            transform: translateX(-20px);
        }

        /* iOS Checkbox */
        .ios-checkbox {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid var(--list-border);
            border-radius: 50%;
            margin-right: 16px;
            outline: none;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .ios-checkbox:checked {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .ios-checkbox:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%) rotate(45deg);
            width: 6px;
            height: 12px;
            border-bottom: 2px solid white;
            border-right: 2px solid white;
        }

        .task-text {
            font-size: 17px;
            line-height: 1.3;
            flex: 1;
            transition: color 0.2s;
        }

        .task-item.completed .task-text {
            color: var(--text-secondary);
            text-decoration: line-through;
        }

        /* Controls / Mic Area */
        .controls-area {
            position: fixed;
            bottom: env(safe-area-inset-bottom);
            left: 0;
            width: 100%;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(to top, var(--bg-color) 70%, transparent);
            pointer-events: none; /* Let clicks pass through gradient */
        }

        .mic-btn-wrapper {
            pointer-events: auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mic-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
            cursor: pointer;
            transition: transform 0.15s, background-color 0.2s;
            z-index: 10;
        }

        .mic-btn:active {
            transform: scale(0.92);
        }

        .mic-btn.listening {
            background-color: var(--danger-color);
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
            animation: pulse-red 1.5s infinite;
        }

        .mic-btn.processing {
            background-color: var(--list-border);
            pointer-events: none;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.6); }
            70% { box-shadow: 0 0 0 20px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        .status-badge {
            margin-top: 12px;
            padding: 6px 12px;
            border-radius: 16px;
            background-color: rgba(0,0,0,0.1);
            color: var(--text-color);
            font-size: 13px;
            font-weight: 500;
            pointer-events: auto;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s, transform 0.3s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        @media (prefers-color-scheme: dark) {
            .status-badge {
                background-color: rgba(255,255,255,0.15);
            }
        }

        .status-badge.show {
            opacity: 1;
            transform: translateY(0);
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mis Tareas</h1>
        <div class="subtitle" id="task-count">0 tareas</div>
    </header>

    <main id="main-content">
        <div class="task-list" id="task-list">
            <!-- Tasks will be rendered here -->
        </div>
        
        <div class="empty-state" id="empty-state" style="display: none;">
            <i class="ph ph-list-checks text-5xl mb-3 opacity-50"></i>
            <p class="text-[17px] font-medium">Todo al día</p>
            <p class="text-[13px] mt-1 opacity-70">Toca el micrófono para dictar tus tareas.</p>
        </div>
    </main>

    <div class="controls-area">
        <div class="mic-btn-wrapper">
            <button class="mic-btn" id="mic-btn">
                <i class="ph-fill ph-microphone text-3xl" id="mic-icon"></i>
                <div class="spinner" id="loading-spinner"></div>
            </button>
        </div>
        <div class="status-badge" id="status-badge">Toca para hablar</div>
    </div>

    <script>
        // DOM Elements
        const taskListEl = document.getElementById('task-list');
        const emptyStateEl = document.getElementById('empty-state');
        const taskCountEl = document.getElementById('task-count');
        const micBtn = document.getElementById('mic-btn');
        const micIcon = document.getElementById('mic-icon');
        const loadingSpinner = document.getElementById('loading-spinner');
        const statusBadge = document.getElementById('status-badge');

        // State (Load from localStorage)
        let tasks = JSON.parse(localStorage.getItem('apple_smart_tasks')) || [];
        let isListening = false;
        let isProcessing = false;

        // --- Core UI Functions ---
        function saveTasks() {
            localStorage.setItem('apple_smart_tasks', JSON.stringify(tasks));
        }

        function updateUI() {
            // Empty state handling
            if (tasks.length === 0) {
                taskListEl.style.display = 'none';
                emptyStateEl.style.display = 'flex';
            } else {
                taskListEl.style.display = 'block';
                emptyStateEl.style.display = 'none';
            }

            // Task count
            const pending = tasks.filter(t => !t.completed).length;
            taskCountEl.textContent = `${pending} tarea${pending !== 1 ? 's' : ''} pendiente${pending !== 1 ? 's' : ''}`;
        }

        function renderTasks() {
            taskListEl.innerHTML = '';
            
            tasks.forEach((task, index) => {
                const item = document.createElement('div');
                item.className = `task-item ${task.completed ? 'completed' : ''}`;
                item.id = `task-${task.id}`;
                
                item.innerHTML = `
                    <input type="checkbox" class="ios-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                    <span class="task-text">${escapeHTML(task.text)}</span>
                    <button onclick="deleteTask(${task.id})" class="text-red-500 p-2 ml-2 active:opacity-50">
                        <i class="ph ph-trash text-xl"></i>
                    </button>
                `;
                taskListEl.appendChild(item);
            });
            updateUI();
        }

        window.toggleTask = function(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
            }
        }

        window.deleteTask = function(id) {
            const el = document.getElementById(`task-${id}`);
            if (el) {
                el.classList.add('removing');
                setTimeout(() => {
                    tasks = tasks.filter(t => t.id !== id);
                    saveTasks();
                    renderTasks();
                }, 300); // Wait for transition
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag)
            );
        }

        function setStatus(message, duration = 3000) {
            statusBadge.textContent = message;
            statusBadge.classList.add('show');
            
            if (duration > 0) {
                setTimeout(() => {
                    statusBadge.classList.remove('show');
                }, duration);
            }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES'; // Spanish Language
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                isListening = true;
                micBtn.classList.add('listening');
                setStatus("Escuchando...", 0); // Permanent until stopped
            };

            recognition.onresult = async function(event) {
                const transcript = event.results[0][0].transcript;
                setStatus("Procesando...", 0);
                await processWithGemini(transcript);
            };

            recognition.onerror = function(event) {
                isListening = false;
                micBtn.classList.remove('listening');
                if (event.error !== 'aborted') {
                    setStatus("Error al escuchar");
                } else {
                    statusBadge.classList.remove('show');
                }
            };

            recognition.onend = function() {
                isListening = false;
                if (!isProcessing) {
                    micBtn.classList.remove('listening');
                }
            };
        } else {
            setStatus("Dictado no soportado en este navegador");
            micBtn.style.opacity = '0.5';
        }

        micBtn.addEventListener('click', () => {
            if (!recognition || isProcessing) return;
            
            if (isListening) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch(e) {
                    console.error("Mic error:", e);
                }
            }
        });

        async function processWithGemini(transcript) {
            isProcessing = true;
            
            // UI Update for loading
            micBtn.classList.remove('listening');
            micBtn.classList.add('processing');
            micIcon.style.display = 'none';
            loadingSpinner.style.display = 'block';

            try {
                // Gemini API configuration
                const apiKey = ""; // Leave blank, Canvas injects it automatically
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                
                const systemPrompt = `Eres un asistente inteligente para una lista de tareas de iOS.
                El usuario dictará sus tareas. Puede que diga una sola cosa, o varias cosas mezcladas en lenguaje natural (ej. "Tengo que lavar el coche y comprar pan, ah y también llamar al dentista").
                Tu trabajo es identificar las tareas procesables y devolver un arreglo JSON.
                Limpia las frases y haz que suenen como tareas accionables (ej. "Lavar el coche", "Comprar pan").
                Si no hay tareas claras, devuelve un arreglo vacío [].`;

                const payload = {
                    contents: [{ parts: [{ text: transcript }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "ARRAY",
                            items: { type: "STRING" }
                        }
                    }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("API Request Failed");

                const result = await response.json();
                
                if (result.candidates && result.candidates[0].content) {
                    const jsonString = result.candidates[0].content.parts[0].text;
                    const newTasksStrings = JSON.parse(jsonString);
                    
                    if (newTasksStrings && newTasksStrings.length > 0) {
                        newTasksStrings.forEach(taskText => {
                            tasks.push({
                                id: Date.now() + Math.random(),
                                text: taskText,
                                completed: false
                            });
                        });
                        saveTasks();
                        renderTasks();
                        
                        // Scroll to bottom
                        setTimeout(() => {
                            document.getElementById('main-content').scrollTo({
                                top: taskListEl.scrollHeight,
                                behavior: 'smooth'
                            });
                        }, 100);
                        
                        setStatus(`¡${newTasksStrings.length} tarea(s) añadida(s)!`);
                    } else {
                        setStatus("No se detectaron tareas");
                    }
                }
            } catch (error) {
                console.error("Gemini Error:", error);
                setStatus("Error al procesar. Intenta de nuevo.");
            } finally {
                // Restore UI
                isProcessing = false;
                micBtn.classList.remove('processing');
                micIcon.style.display = 'block';
                loadingSpinner.style.display = 'none';
                
                // Hide status after a few seconds if it was a success message
                setTimeout(() => {
                    statusBadge.classList.remove('show');
                }, 3000);
            }
        }

        // Initialize App
        renderTasks();

    </script>
</body>
</html>
